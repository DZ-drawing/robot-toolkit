[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Allow gradual typing

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[project]
name = "robot-ik"
version = "0.3.0"
description = "Fast 6-DOF Inverse Kinematics and Rigid Body Dynamics (C++ accelerated)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Danny Zeng", email = "danny@zeng.ai"}
]
keywords = ["robotics", "inverse kinematics", "dynamics", "manipulator", "6-DOF"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7.0"]
meshcat = ["meshcat>=0.3.0"]
dev = ["pytest>=7.0", "pytest-cov", "black", "ruff", "mypy"]
all = ["robot-ik[viz,meshcat]"]

[project.urls]
Homepage = "https://github.com/DZ-drawing/robot-toolkit"
Repository = "https://github.com/DZ-drawing/robot-toolkit"
Documentation = "https://github.com/DZ-drawing/robot-toolkit/blob/main/README.md"
Issues = "https://github.com/DZ-drawing/robot-toolkit/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

